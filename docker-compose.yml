services:
  postgres:
    image: postgres:16-alpine
    container_name: carrom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carrom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carrom}
      POSTGRES_DB: ${POSTGRES_DB:-carrom}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - carrom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-carrom}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  carrom_pgdata:
